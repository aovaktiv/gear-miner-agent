[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gear-miner-agent"
version = "0.1.0"
description = "A web-mining agent for building structured gear catalogs, starting with running shoes."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Alex Vermillion" }
]
dependencies = []

[project.scripts]
gear-miner = "gear_miner.cli:main"

[tool.setuptools.packages.find]
include = ["gear_miner*"]
